<!doctype html>
<html lang="en">
  <head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">

    <style>
        body {
            background-color: #f9f9f9;
            font-family: Arial, snas-serif;
            padding: 30px 15px;
        }
        h1 {
            text-align: center;
            color: #FF5A43;
        }
        .hobby-card{
            text-align: center;
            border: 2px solid #FF5A43;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background-color: #fff8e1;
        }
        .hobby-card h3 {
            color: #FF5a43;
        }
    </style>
  </head>
  <body>
      

      <!--STEP 2 - container keeps the layout neat and centred -->
      <div class="container">
    <h1>My Hobby Cards</h1>
        <!-- STEP 3 - row holds all the colums in one horizontal
     line-->
     <div class="row">

        <!-- STEP 4 - col-12: full width on phones
                    col-md-6: half width on tablets
                    col-lg-4: one-third on desktops -->
        <div class="col-12 col-md-6 col-lg-4">
            <div class="hobby-card">
                <h3>Drawing</h3>
                <p>I love sketching animals and comic characters.</p>
            </div>
        </div>

        <div class="col-12 col-md-12 col-lg-4">
             <div class="hobby-card">
                <h3>Football</h3>
                <p>I plat football every evening with my friends.</p>
            </div>
        </div>

        <div class="col-12 col-md-12 col-lg-4">
            <div class="hobby-card">
            <h3>Reading</h3>
            <p>My favourite books are adventure stories.</p>
        </div>
     </div>

    </div>
</div>
    
  </body>
</html>
